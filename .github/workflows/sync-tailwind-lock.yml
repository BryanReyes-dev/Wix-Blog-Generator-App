name: Temporary Tailwind lockfile sync

on:
  push:
    branches:
      - feat/research-sources-and-preview
    paths:
      - "package.json"
      - ".github/workflows/sync-tailwind-lock.yml"

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feat/research-sources-and-preview
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync Tailwind dependency lockfile"
          git push origin HEAD:feat/research-sources-and-preview